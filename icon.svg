<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- fond « parchemin » : gris chaud clair -> plus foncé -->
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ece7dd"/>
      <stop offset="1"   stop-color="#d9cfb8"/>
    </linearGradient>
    <!-- lettre ن : dégradé or brûlé (accent apprendre-arabe) -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#c2872a"/>
      <stop offset="1"   stop-color="#8a5615"/>
    </linearGradient>
  </defs>

  <!-- carré arrondi (même rayon que l'ancien icône) -->
  <rect width="512" height="512" rx="112" fill="url(#parchment)"/>

  <!-- lignes réglées, très pâles — évoque un cahier de leçons -->
  <g stroke="#a06a1f" stroke-width="1.4" opacity="0.14" stroke-linecap="round">
    <line x1="72"  y1="128" x2="440" y2="128"/>
    <line x1="72"  y1="180" x2="440" y2="180"/>
    <line x1="72"  y1="332" x2="440" y2="332"/>
    <line x1="72"  y1="384" x2="440" y2="384"/>
  </g>

  <!-- ن (nūn) : la lettre du قَلَم (sourate 68), symbole de l'écriture / du savoir -->
  <text x="256" y="298" font-family="'Scheherazade New', 'Amiri', 'Geeza Pro', 'Noto Naskh Arabic', serif"
        font-size="320" fill="url(#ink)" text-anchor="middle"
        dominant-baseline="central" direction="rtl" font-weight="700">ن</text>

  <!-- souligné bref, comme un trait de plume, sous la lettre -->
  <path d="M170 400 Q256 420 342 400" stroke="#a06a1f" stroke-width="4"
        fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
